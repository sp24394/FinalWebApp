{%extends 'base.html'%}

{%block title%}Godot Forum{%endblock%}

{%block content%}
<div style="display: flex;">
	<div id="post-view" style="margin: auto;">
		<div id="forum-banner">
			<img src="{{url_for('static', filename='media/forum-bg.png')}}" alt="">
			<h1>Welcome to Godot Forum!</h1>
		</div>
		<h2>Recent Posts</h2>
		{%if posts | length < 1%}<p style="color: rgba(255,255,255,0.6); width: 100%; text-align: center;">No posts yet! Be the first!</p>{%endif%}
		<div id="posts" class="contain-width">
		{%for post in posts%}
			<a href="/forum/posts/{{post.post_id}}" class="post{%if min_post == post%} bottom-post{%elif max_post == post%} top-post{%endif%}">
				<div id="post-{{post.post_id}}">
					<div class="upper-post split">
						<div style="flex: 2;">
							<p class="post-title">{{post.title}}</p>
							<span style="display: flex;"><div class="category-square c-general"></div><p>General<span style="color: rgba(255,255,255,0.6); margin-left: 0.6rem;">@person</span></p></span>
						</div>
						<p class="post-label">3 replies<br>active 10d ago</p>
					</div>
				</div>
			</a>
		{%endfor%}
		</div>
	</div>
</div>
{%endblock%}

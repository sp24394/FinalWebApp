{%extends 'base.html'%}

{%block title%}Godot Engine{%endblock%}

{%block content%}
<div class="banner-container">
    <img id="random-banner" src="{{url_for('static', filename='media/banners/' ~ range(1, 5) | random ~ '.png')}}" alt="">
    <div class="banner-overlay">
        <h1>Your free, open-source game engine.</h1>
        <span>Develop your 2D & 3D games, cross-platform projects, or even XR ideas!</span>
        <a class="button" style="margin-top: 2.5rem;" href="{{url_for('static', filename='releases/Godot_v4.7.2-stable_win64.exe.zip')}}" download="godot-4.7.2-stable_win64.zip">
            <span>Download Latest</span>
            <span class="version-label">4.7.2</span>
        </a>
        <a class="button button-dark" style="margin-top: 0.75rem; margin-bottom: 0.5rem;" href="{{url_for('changelogs')}}">
            <span>Changelogs</span>
        </a>
        <span>Looking for <a href="{{url_for('download_page')}}#old">other versions</a>?</span>
    </div>
</div>
{%endblock%}

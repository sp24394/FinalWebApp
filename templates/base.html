<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}{%endblock%}</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
    <link rel="shortcut icon" href="{{url_for('static', filename='media/favicon.png')}}" type="image/x-icon">
    <link rel="icon" href="{{url_for('static', filename='media/favicon.svg')}}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="contain-width">
            <a href="/" class="logo">
                <img src="{{url_for('static', filename='media/logo-dark.svg')}}" alt="Godot Logo" height="52px" style="margin: 10px 0;">
            </a>
            <div id="header-links">
                <a href="{{url_for('community')}}">Community</a>
                <a href="{{url_for('static', filename='releases/Godot_v4.7.2-stable_win64.exe.zip')}}" download="godot-4.7.2-stable_win64.zip" class="highlighted">Download</a>
            </div>
        </div>
    </header>
    {%block content%}{%endblock%}
</body>
</html>
